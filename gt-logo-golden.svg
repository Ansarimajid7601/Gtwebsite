<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 170 980 740" role="img" aria-label="GT logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>GT Logo</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6DE8D"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#A67C1A"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A227"/>
      <stop offset="0.5" stop-color="#F0D36F"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="goldStem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8921F"/>
      <stop offset="0.35" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#E8C85A"/>
    </linearGradient>
    <linearGradient id="shadeTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E5210" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#6E5210" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shadeBottom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E5210" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A3508" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- G -->
  <path id="g-shape" fill="url(#gold)" d="M790 203 L330 203 C180 203 85 310 85 445 C85 600 190 705 340 705 L580 705 L580 580 L360 580 C290 580 237 525 237 450 C237 380 285 325 360 325 L695 325 Z"/>
  <!-- G ribbon-fold shading -->
  <path fill="url(#shadeTop)" d="M330 203 L560 203 L560 325 L360 325 C300 325 262 360 245 400 C250 300 280 230 330 203 Z" transform="translate(0 0)" opacity="0.9"/>
  <path fill="url(#shadeBottom)" d="M340 580 L580 580 L580 705 L340 705 C300 705 262 690 230 665 C260 620 300 585 340 580 Z"/>

  <!-- T bar -->
  <path fill="url(#goldBar)" d="M440 378 L1012 378 L920 508 L350 508 Z"/>
