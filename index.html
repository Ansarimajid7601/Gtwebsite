const mt=(c,m,r)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r}),
bx=(w,h,d,mat,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);G.add(o);return o},
steel=mt(0xC9A96E,.92,.3);

bx(1.7,2.7,.05,steel,0,0,-.42);
bx(.05,2.7,.9,steel,-.825,0,0);
bx(.05,2.7,.9,steel,.825,0,0);
bx(1.7,.05,.9,steel,0,1.325,0);
bx(1.7,.05,.9,steel,0,-1.325,0);
[-.7,.1,.9].forEach(y=>bx(1.6,.04,.85,mt(0xF3E9D6,.5,.5),0,y,0));
bx(.04,.04,1.5,mt(0xE8CF9A,.9,.2),0,.65,0).rotation.set(0,Math.PI/2,0);

const ltr=(c,x)=>{
  const cv=document.createElement('canvas');cv.width=cv.height=256;
  const cx=cv.getContext('2d'),t=new THREE.CanvasTexture(cv),dw=()=>{
    cx.clearRect(0,0,256,256);cx.font='700 220px "Cormorant Garamond",Georgia,serif';
    cx.textAlign='center';cx.textBaseline='middle';cx.fillStyle='#E8CF9A';cx.fillText(c,128,140);t.needsUpdate=true
  };
  dw();
  const o=new THREE.Mesh(new THREE.PlaneGeometry(.72,.72),new THREE.MeshBasicMaterial({map:t,transparent:true}));
  o.position.set(x,.6,.034);
  return o
};

const door=s=>{
  const p=new THREE.Group();p.position.set(s*.85,0,.45);
  const d=new THREE.Mesh(new THREE.BoxGeometry(.82,2.6,.06),mt(0x5E4636,.6,.35));
  d.position.x=-s*.42;
  const h=new THREE.Mesh(new THREE.BoxGeometry(.05,.55,.06),mt(0xE8CF9A,.95,.15));
  h.position.set(-s*.76,0,.06);
  p.add(d,h,ltr(s<0?'G':'T',-s*.42));
  G.add(p);
  return p
};

il=new THREE.PointLight(0xFFE2B0,0,5);il.position.set(0,.4,.1);G.add(il);

const l2=new THREE.PointLight(0xE8CF9A,1.8,14);l2.position.set(4,-2,-2);
sc.add(l1,l2);

const N=700,pa=new Float32Array(N*3),ca=new Float32Array(N*3),pal=[0xB8955A,0xD8BC86,0x8A6742,0xC9B391].map(c=>new THREE.Color(c));
for(let i=0;i<N;i++){
  const r=3.5+Math.random()*7,a=Math.random()*6.283,b=Math.acos(2*Math.random()-1),c=pal[i%4];

}
const g=new THREE.BufferGeometry();
g.setAttribute('position',new THREE.BufferAttribute(pa,3));

addEventListener('pointermove',e=>{M.x=e.clientX/innerWidth*2-1;M.y=e.clientY/innerHeight*2-1});

})(0);
