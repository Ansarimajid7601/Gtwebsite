const mt=(c,m,r)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r}),

gg=(cx,x0,y0,x1,y1)=>{const g=cx.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,'#F7E7B8');g.addColorStop(.5,'#D9B766');g.addColorStop(1,'#9A7442');return g},
tex=(w,h,draw)=>{const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d'),t=new THREE.CanvasTexture(cv);t.anisotropy=4;const f=()=>{cx.clearRect(0,0,w,h);draw(cx,w,h);t.needsUpdate=true};f();TX.push(f);return t},
spaced=(cx,str,x,y,sz,gap,fill,font)=>{cx.font=`700 ${sz}px ${font||sans}`;cx.textAlign='left';cx.textBaseline='middle';cx.fillStyle=fill;const ch=[...str],ws=ch.map(c=>cx.measureText(c).width),tot=ws.reduce((a,b)=>a+b,0)+gap*(ch.length-1);let p=x-tot/2;ch.forEach((c,i)=>{cx.fillText(c,p,y);p+=ws[i]+gap})},
badge=(cx,x,y,r)=>{const g=gg(cx,x-r,y-r,x+r,y+r);cx.strokeStyle=g;cx.lineWidth=r*.07;cx.beginPath();cx.arc(x,y,r,0,6.283);cx.stroke();cx.lineWidth=r*.025;cx.beginPath();cx.arc(x,y,r*.87,0,6.283);cx.stroke();cx.font=`700 ${r*1.15}px ${serif}`;cx.textAlign='center';cx.textBaseline='middle';cx.fillStyle=g;cx.fillText('GT',x,y+r*.06)},

const MODELS={
/* ---------- ALMIRAH: G on left door, T on right door ---------- */
almirah(m){
  const steel=mt(0xC9A96E,.92,.3),shelf=mt(0xF3E9D6,.5,.5),rail=mt(0xE8CF9A,.9,.2),dm=mt(0x5E4636,.6,.35),hm=mt(0xE8CF9A,.95,.15);
  bx(1.7,2.7,.05,steel,0,0,-.42,m);bx(.05,2.7,.9,steel,-.825,0,0,m);bx(.05,2.7,.9,steel,.825,0,0,m);
  bx(1.7,.05,.9,steel,0,1.325,0,m);bx(1.7,.05,.9,steel,0,-1.325,0,m);
  [-.7,.1,.9].forEach(y=>bx(1.6,.04,.85,shelf,0,y,0,m));
  bx(.04,.04,1.5,rail,0,.65,0,m).rotation.set(0,Math.PI/2,0);
  const lab=(c,w)=>tex(320,512,(cx,W)=>{cx.font=`700 330px ${serif}`;cx.textAlign='center';cx.textBaseline='middle';cx.fillStyle=gg(cx,0,60,W,380);cx.fillText(c,W/2,215);cx.fillStyle='#E8CF9A';cx.fillRect(W/2-70,372,140,3);spaced(cx,w,W/2,430,50,14,'#E8CF9A')});
  const door=(s,c,w)=>{const p=new THREE.Group();p.position.set(s*.85,0,.45);bx(.82,2.6,.06,dm,-s*.42,0,0,p);bx(.05,.55,.06,hm,-s*.76,0,.06,p);pl(.72,1.152,lab(c,w),-s*.42,.35,.034,p);m.add(p);return p};
  const L=door(-1,'G','GOLDEN'),R=door(1,'T','TRUST');
  return d=>{L.rotation.y=-d;R.rotation.y=d};
},
/* ---------- FRIDGE: double door, GT badge + name on the big door ---------- */
fridge(m){
  m.position.y=.04;
  const shell=mt(0xC9A96E,.85,.3),inner=mt(0xF6F0E2,.2,.6),dm=mt(0x4A3A2E,.7,.28),hm=mt(0xE8CF9A,.95,.15),drw=mt(0xE8E0CF,.3,.6);
  bx(1.5,2.8,.05,shell,0,0,-.42,m);bx(.05,2.8,.9,shell,-.725,0,0,m);bx(.05,2.8,.9,shell,.725,0,0,m);bx(1.5,.05,.9,shell,0,1.375,0,m);bx(1.5,.05,.9,shell,0,-1.375,0,m);
  bx(1.4,2.7,.02,inner,0,0,-.39,m);bx(.02,2.7,.85,inner,-.69,0,0,m);bx(.02,2.7,.85,inner,.69,0,0,m);
  bx(1.4,.05,.85,inner,0,.43,0,m);bx(1.4,.04,.8,inner,0,.92,0,m);bx(1.4,.04,.8,inner,0,-.4,0,m);bx(1.4,.04,.8,inner,0,-.95,0,m);
  bx(1.3,.34,.74,drw,0,-1.2,.03,m);
  const b1=mt(0x8A6742,.3,.5),b2=mt(0xF3E9D6,.2,.6);
  [-.45,-.25,-.05,.15].forEach((x,i)=>{const b=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.32,12),i%2?b1:b2);b.position.set(x,-.22,.05);m.add(b)});
  bx(.3,.22,.3,b1,.42,-.27,.05,m);bx(.34,.2,.3,b2,-.4,-.83,.05,m);bx(.4,.18,.3,b2,.3,.01,.05,m);
  [-.6,.6].forEach(x=>bx(.12,.06,.12,mt(0x3A2C23,.4,.6),x,-1.43,.3,m));
  const logo=tex(512,640,(cx,W)=>{badge(cx,W/2,230,170);spaced(cx,'GOLDEN TRUST',W/2,500,40,8,gg(cx,60,0,W-60,0),sans);cx.fillStyle='#E8CF9A';cx.fillRect(W/2-60,540,120,3)});
  const mini=tex(256,256,cx=>badge(cx,128,128,100));
  const door=(h,yc,hOff,hH,fn)=>{const p=new THREE.Group();p.position.set(-.75,yc,.46);bx(1.5,h,.07,dm,.75,0,0,p);bx(.05,hH,.09,hm,1.38,hOff,.075,p);fn(p);m.add(p);return p};
  const F=door(.92,.92,-.12,.3,p=>pl(.34,.34,mini,.72,.05,.037,p)),
        R=door(1.8,-.5,.3,.7,p=>pl(.9,1.125,logo,.72,-.18,.037,p));
  return d=>{F.rotation.y=-d;R.rotation.y=-d};
},
/* ---------- AIR COOLER: louvred front lifts up, fan spins inside ---------- */
cooler(m){
  m.position.y=.08;
  const W=1.3,H=2.4,D=.85,shell=mt(0xC9A96E,.85,.35),dark=mt(0x3A2C23,.5,.5),cream=mt(0xF3E9D6,.5,.45),gold=mt(0xE8CF9A,.9,.2);
  bx(W,H,.05,shell,0,0,-D/2+.025,m);bx(.05,H,D,shell,-(W/2-.025),0,0,m);bx(.05,H,D,shell,W/2-.025,0,0,m);
  bx(W+.06,.08,D+.06,gold,0,H/2+.02,0,m);bx(W,.06,D,dark,0,-H/2+.03,0,m);bx(W-.1,.04,D-.1,cream,0,-.5,0,m);bx(W-.1,1.6,.02,cream,0,.35,-D/2+.07,m);
  for(let i=0;i<12;i++){[-1,1].forEach(s=>{const o=bx(.02,.05,.5,dark,s*(W/2+.005),.75-i*.14,0,m);o.rotation.x=.45})}
  /* lower tank panel with logo */
  bx(W-.02,.7,.05,dark,0,-.85,D/2-.02,m);
  const logo=tex(576,352,(cx)=>{badge(cx,130,176,105);const g=gg(cx,250,0,560,0);spaced(cx,'GOLDEN',410,140,70,8,g,serif);spaced(cx,'TRUST',410,228,70,8,g,serif)});
  pl(.9,.55,logo,0,-.85,D/2+.008,m);
  /* fan */
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.5,.035,12,40),gold);ring.position.set(0,.5,-.05);m.add(ring);
  const fan=new THREE.Group();fan.position.set(0,.5,-.05);m.add(fan);
  for(let i=0;i<4;i++){const bp=new THREE.Group();bp.rotation.z=i*Math.PI/2;const bl=bx(.17,.42,.015,gold,0,.3,0,bp);bl.rotation.y=.45;fan.add(bp)}
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.08,20),dark);hub.rotation.x=Math.PI/2;fan.add(hub);
  /* hinged louvre panel (pivot at top) */
  const pg=new THREE.Group();pg.position.set(0,1.12,D/2+.02);m.add(pg);
  bx(.06,1.55,.05,gold,-(W/2-.07),-.775,0,pg);bx(.06,1.55,.05,gold,W/2-.07,-.775,0,pg);bx(W-.08,.06,.05,gold,0,-.03,0,pg);bx(W-.08,.06,.05,gold,0,-1.52,0,pg);
  bx(W-.2,1.4,.01,dark,0,-.775,-.02,pg);
  for(let i=0;i<13;i++){const o=bx(W-.2,.045,.03,cream,0,-.12-i*.105,0,pg);o.rotation.x=.55}
  [-.5,.5].forEach(x=>[-.3,.3].forEach(z=>{const w=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.06,16),dark);w.rotation.z=Math.PI/2;w.position.set(x,-H/2-.09,z);m.add(w)}));
  let ph=0,last=0;
  return(d,t)=>{const dt=Math.min(.05,(t-last)/1000||0);last=t;pg.rotation.x=-d*.75;ph+=dt*d*18;fan.rotation.z=ph}
},
/* ---------- TV: switches on as you scroll, screen shows GT + Golden Trust ---------- */
tv(m){
  m.position.y=-.08;m.scale.setScalar(1.05);
  const dark=mt(0x17120F,.7,.3),gold=mt(0xD8BC86,.95,.2);
  bx(2.76,1.72,.08,gold,0,.35,-.012,m);
  bx(2.7,1.66,.1,dark,0,.35,0,m);
  bx(1.7,.9,.2,dark,0,.35,-.15,m);
  bx(.22,.5,.08,dark,0,-.72,-.05,m);bx(1.2,.05,.55,dark,0,-1,-.02,m);bx(1.2,.012,.5,gold,0,-.97,-.02,m);
  const scr=tex(1280,720,(cx,w,h)=>{const g=cx.createRadialGradient(w/2,h/2,40,w/2,h/2,w*.6);g.addColorStop(0,'#4A382B');g.addColorStop(1,'#14100C');cx.fillStyle=g;cx.fillRect(0,0,w,h);cx.strokeStyle='rgba(232,207,154,.35)';cx.lineWidth=3;cx.strokeRect(36,36,w-72,h-72);badge(cx,w/2,260,150);spaced(cx,'GOLDEN TRUST',w/2,500,74,26,gg(cx,w*.25,0,w*.75,0),sans);spaced(cx,'SINCE 1991 · BAHRAICH',w/2,592,28,10,'#C9B391',sans)});
  const sm=new THREE.MeshBasicMaterial({map:scr,color:0x070707});
  const sc2=new THREE.Mesh(new THREE.PlaneGeometry(2.54,1.43),sm);sc2.position.set(0,.395,.052);m.add(sc2);
  const chin=tex(1024,128,(cx,w)=>{spaced(cx,'GT  ·  GOLDEN TRUST',w/2,64,52,12,gg(cx,200,0,820,0),sans)});
  pl(.9,.112,chin,0,-.405,.052,m);
  const back=tex(256,256,cx=>badge(cx,128,128,100));
  pl(.5,.5,back,0,.4,-.252,m,Math.PI);
  return d=>{const b=Math.min(1,d/1);sm.color.setScalar(.03+.97*b)};
}
};

BM=(k)=>{
  if(MG){G.remove(MG);MG.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(o.material.map)o.material.map.dispose();o.material.dispose()}});TX.length=0}
  let last='';try{last=sessionStorage.getItem('gtK')||''}catch(e){}
  curKind=k||(()=>{const o=KINDS.filter(x=>x!==last);return o[Math.floor(Math.random()*o.length)]})();
  try{sessionStorage.setItem('gtK',curKind)}catch(e){}
  MG=new THREE.Group();G.add(MG);
  upd=MODELS[curKind](MG);
  window.GT_KIND=curKind;
  if(typeof rs==='function')rs();
};
if(document.fonts&&document.fonts.load)document.fonts.load('700 100px "Cormorant Garamond"').then(()=>document.fonts.load('700 50px "DM Sans"')).then(()=>TX.forEach(f=>f())).catch(()=>{});
il=new THREE.PointLight(0xFFE2B0,0,5);il.position.set(0,.4,.1);G.add(il);
sc.add(new THREE.AmbientLight(0xFFF7E6,.55));
const dir=new THREE.DirectionalLight(0xFFF7E6,1.2);dir.position.set(3,4,5);sc.add(dir);
const l1=new THREE.PointLight(0xFFD9A0,2.4,14);l1.position.set(-4,1,3);
const l2=new THREE.PointLight(0xE8CF9A,1.8,14);l2.position.set(4,-2,-2);
sc.add(l1,l2);

const N=700,pa=new Float32Array(N*3),ca=new Float32Array(N*3),pal=[0xB8955A,0xD8BC86,0x8A6742,0xC9B391].map(c=>new THREE.Color(c));
for(let i=0;i<N;i++){
  const r=3.5+Math.random()*7,a=Math.random()*6.283,b=Math.acos(2*Math.random()-1),c=pal[i%4];
  pa.set([r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a)],i*3);
  ca.set([c.r,c.g,c.b],i*3)
}
const g=new THREE.BufferGeometry();
g.setAttribute('position',new THREE.BufferAttribute(pa,3));
g.setAttribute('color',new THREE.BufferAttribute(ca,3));
pts=new THREE.Points(g,new THREE.PointsMaterial({size:.065,vertexColors:true,transparent:true,opacity:.85}));
sc.add(pts);

const rs=()=>{
  ren.setSize(innerWidth,innerHeight,false);
  cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix();
  const w=innerWidth>820;
  S.X0=w?Math.min(3.2,1.7*cam.aspect):0;
  if(w){
    MBF=null;
    G.position.set(0,0,0);
    /* desktop only: larger model, eased down on narrower/shorter windows so it never crowds the headline */
    G.scale.setScalar(.88*FIT[curKind][0]*Math.min(1.5,Math.max(1,1+(cam.aspect-1.4)*.8)));
    return
  }
  /* MOBILE: park the model in the empty space above the headline, then
     let it grow to the centre while the user scrolls (S.mb 1 -> 0). */
  const s1=.88*FIT[curKind][1],y1=.5;
  let s0=s1,y0=y1;
  try{
    const hl=document.querySelector('.hl'),hd=document.querySelector('header');
    G.scale.setScalar(1);G.rotation.set(0,0,0);G.position.set(0,0,0);G.updateMatrixWorld(true);
    const bb=new THREE.Box3().setFromObject(G),sz=new THREE.Vector3();bb.getSize(sz);
    if(hl&&sz.y>0){
      const visH=2*S.z*Math.tan(cam.fov*Math.PI/360),ppu=innerHeight/visH,
      top=(hd?hd.offsetHeight:64)+24,bot=Math.max(top+150,hl.offsetTop+hl.offsetHeight*.3),avail=bot-top,
      wU=Math.hypot(sz.x,sz.z)*.85;
      s0=Math.min(1.15,avail*.9/(sz.y*ppu),innerWidth*.98/(wU*ppu));
      const cyU=(bb.max.y+bb.min.y)/2,upU=(innerHeight/2-(top+avail/2))/ppu;
      y0=upU-cyU*s0
    }
  }catch(e){}
  MBF={s0,y0,s1,y1}
};
rs();
addEventListener('resize',rs);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{try{rs()}catch(e){}});
BM();
addEventListener('pointermove',e=>{M.x=e.clientX/innerWidth*2-1;M.y=e.clientY/innerHeight*2-1});

(function tick(t){
  requestAnimationFrame(tick);
  const gl = $('#gl');
  if(document.body.dataset.p!=='home'){
    if(gl) gl.style.opacity = '0';
    return;
  }
  if(gl) gl.style.opacity = S.opacity;
  m.x+=(M.x-m.x)*.05;
  m.y+=(M.y-m.y)*.05;
  G.rotation.y=S.r+(RM?0:(1-S.k)*Math.sin((t-T0)*.0007)*.32)+m.x*.35;
  G.rotation.x=m.y*.12;
  G.position.x=S.x*S.X0;
  if(MBF){G.position.y=MBF.y1+(MBF.y0-MBF.y1)*S.mb;G.scale.setScalar(MBF.s1+(MBF.s0-MBF.s1)*S.mb)}
  if(upd)upd(S.d,t);
  il.intensity=S.d*1.6;
  cam.position.set(m.x*.4,-m.y*.3,S.z);
  cam.lookAt(0,0,0);
  pts.rotation.y=t*.00003+S.r*.25;
  pts.position.set(-m.x*.3,m.y*.3,0);
  ren.render(sc,cam)
})(0);
}catch(err){console.error("3D Error:", err);}

function hero(){
  if(BM&&heroRuns++>0)BM();
  ScrollTrigger.getAll().forEach(t=>t.kill());
  Object.assign(S,{r:0,k:0,d:0,z:7.5,x:1,mb:1,opacity:1});T0=performance.now();
  
  gsap.timeline({scrollTrigger:{trigger:'#hero',start:'top top',end:'bottom bottom',scrub:1}})
    .to(S,{r:6.283,k:1,z:6.3,ease:'none',duration:1},0)
    .to(S,{x:0,mb:0,ease:'power2.inOut',duration:.5},0)
    .to(S,{d:1.55,ease:'none',duration:.4},.6)
    .to('.hl',{autoAlpha:0,y:-60,duration:.2},.1)
    .to('.sd',{autoAlpha:0,duration:.04},0)
    .fromTo('.hm',{autoAlpha:0,y:30},{autoAlpha:1,y:0,duration:.2},.78);

  gsap.to(S, {
    opacity: 0,
    ease: 'power1.out',
    scrollTrigger: {
      trigger: '.mq',
      start: 'top 70%',
      end: 'bottom 30%',
      scrub: true
    }
  });

  const sd=$('.sd');if(sd)sd.onclick=()=>scrollBy({top:innerHeight*.9,behavior:RM?'auto':'smooth'});
  if(!RM)gsap.from('.hl>*',{y:44,opacity:0,duration:1.1,stagger:.14,ease:'power3.out'});
}

function fx(){if(RM){document.querySelectorAll('.cn').forEach(n=>n.textContent=n.dataset.n);return}
const st=t=>gsap.from(t,{y:44,opacity:0,duration:.9,ease:'power3.out',scrollTrigger:{trigger:t,start:'top 88%',once:true}});
if($('.mt'))gsap.to('.mt',{xPercent:-30,ease:'none',scrollTrigger:{trigger:'.mq',start:'top bottom',end:'bottom top',scrub:1}});
document.querySelectorAll('.cn').forEach(n=>{const o={v:0};n.textContent=0;gsap.to(o,{v:+n.dataset.n,duration:1.6,ease:'power2.out',scrollTrigger:{trigger:n,start:'top 90%',once:true},onUpdate:()=>n.textContent=Math.round(o.v)})});
document.querySelectorAll('.stats>div').forEach(st);
document.querySelectorAll('.rvt').forEach(el=>{el.innerHTML=el.textContent.split(' ').map(w=>`<span>${w}</span>`).join(' ');gsap.fromTo(el.children,{opacity:.2},{opacity:1,stagger:.1,ease:'none',scrollTrigger:{trigger:el,start:'top 82%',end:'bottom 55%',scrub:1}})});
if($('.ln')){const vm=matchMedia('(max-width:640px)').matches;gsap.fromTo('.ln',{scaleX:vm?1:0,scaleY:vm?0:1},{scaleX:1,scaleY:1,ease:'none',scrollTrigger:{trigger:'.steps',start:'top 78%',end:'bottom 62%',scrub:1}});}
document.querySelectorAll('.steps>div:not(.ln)').forEach(st)}

function go(keep){const h=location.hash.replace('#/','').split('?')[0]||'home',p=pages[h]?h:'home';document.body.dataset.p=p;$('#app').innerHTML=pages[p]();
document.querySelectorAll('nav a').forEach(a=>{const n=a.getAttribute('href').replace('#/','')||'home';n===p?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
document.title='Golden Trust · '+p[0].toUpperCase()+p.slice(1);if(!keep)scrollTo(0,0);
if(window.ScrollTrigger){gsap.registerPlugin(ScrollTrigger);ScrollTrigger.getAll().forEach(t=>t.kill());if(p==='home')hero();fx()}
if(p==='admin'&&!AU)$('#lg').onclick=()=>{const u=$('#lu').value.trim(),w=$('#lp').value,c=D.a||{u:'salman',p:'golden'};if(u===c.u&&(w===c.p||(c.h&&w==='golden'))){AU=true;try{sessionStorage.setItem('gtU','1')}catch(e){}go(1)}else toast('Wrong ID or password.')};
if(p==='admin'&&AU){$('#out').onclick=()=>{AU=false;try{sessionStorage.removeItem('gtU')}catch(e){}go(1)};$('#cp').onclick=async()=>{const u=$('#nu').value.trim(),w=$('#np').value;if(u.length<3||w.length<6)return toast('Use an ID of 3+ and a password of 6+ characters.');save(P,{u,p:w})}}
if(p==='admin'&&AU)$('#add').onclick=async()=>{const n=$('#an').value.trim();if(!n)return toast('Add a product name first.');const f=$('#ai').files[0];save([{id:Date.now().toString(36),name:n,cat:$('#ac').value,co:$('#aco').value.trim(),price:$('#ap').value.trim(),desc:$('#ad').value.trim(),img:f?await shrink(f):''},...P])}}
let tp=0,tt;$('#logo').addEventListener('click',e=>{e.preventDefault();clearTimeout(tt);if(++tp>=5){tp=0;location.hash='#/admin'}else location.hash='#/';tt=setTimeout(()=>tp=0,2500)});
try{if(sessionStorage.getItem('gtA')){sessionStorage.removeItem('gtA');location.hash='#/admin'}}catch(e){}
addEventListener('hashchange',()=>go());go();
</script><script>
(function(){var wb=document.getElementById('wb');if(!wb)return;var tk=0;
function chk(){tk=0;var d=document.documentElement,max=d.scrollHeight-innerHeight,y=window.scrollY||d.scrollTop;wb.classList.toggle('show',max<=40||y>=max*.5)}
function q(){if(!tk)tk=requestAnimationFrame(chk)}
addEventListener('scroll',q,{passive:true});addEventListener('resize',q);addEventListener('load',chk);
addEventListener('hashchange',function(){setTimeout(chk,150);setTimeout(chk,800)});
var a=document.getElementById('app');if(a&&window.ResizeObserver)new ResizeObserver(q).observe(a);
chk()})();
</script>
